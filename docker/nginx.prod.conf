server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fast health check endpoints for Coolify / Docker / Load Balancers
    location ~ ^/(healthcheck|health|healthz|api/health|up)$ {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"vf-vendor-dashboard"}\n';
    }

    # Next.js Static Export SPA — client-side routes & trailing slash support
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Hashed static assets (_next/static) — cache 1 year immutable
    location ^~ /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static assets (images, fonts, media)
    location ~* \.(?:css|js|mjs|map|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Dynamic JSON data and HTML files — no-cache to ensure live updates
    location ~* \.(?:html|json|txt)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
}
